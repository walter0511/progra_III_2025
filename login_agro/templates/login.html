<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Agroquímica La Bellota</title>
<style>
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #4dd0e1 0%, #1565c0 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    width: 350px;
    text-align: center;
}
.logo-image {
    width: 150px; 
    height: 150px;
    object-fit: contain;
    margin-bottom: 20px;
}
h1 {
    color: #1565c0;
    margin-bottom: 25px;
    font-size: 20px;
    font-weight: 500;
}
input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 25px;
    border: 1px solid #ccc;
}
button {
    width: 100%;
    padding: 12px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background: #43a047; }
.error { color: red; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-image">
    <h1>Login</h1>
    <form method="POST">
        <input type="text" name="usuario" placeholder="Usuario" required>
        <input type="password" name="contrasena" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
    {% if mensaje %}
    <div class="error">{{ mensaje }}</div>
    {% endif %}
</div>
</body>
</html>
