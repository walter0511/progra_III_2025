<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="text-center mb-4">
            <h2 class="text-white">Sistema Académico</h2>
            <p class="text-light">Ingrese sus credenciales</p>
        </div>
        
        <form id="frmLogin">
            <div class="mb-3">
                <label for="txtUsuario" class="form-label text-white">Usuario</label>
                <input type="text" class="form-control form-control-lg" id="txtUsuario"
                       placeholder="Ingrese su usuario" required>
            </div>
            
            <div class="mb-3">
                <label for="txtClave" class="form-label text-white">Contraseña</label>
                <input type="password" class="form-control form-control-lg" id="txtClave"
                       placeholder="Ingrese su contraseña" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <span id="btnText">Ingresar al Sistema</span>
                    <div id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </button>
            </div>
        </form>
        
        <div class="text-center mt-3">
            <small class="text-light">Universidad Gerardo Barrios - Centro Regional Usulután</small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const frmLogin = document.getElementById('frmLogin');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            
            frmLogin.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const usuario = document.getElementById('txtUsuario').value;
                const clave = document.getElementById('txtClave').value;
                
                // Mostrar loading
                btnText.classList.add('d-none');
                btnLoading.classList.remove('d-none');
                
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usuario: usuario,
                            clave: clave
                        })
                    });
                    
                    const resultado = await response.json();
                    
                    if (resultado.msg === 'ok') {
                        alertify.success(`Bienvenido ${resultado.usuario.nombre}`);
                        setTimeout(() => {
                            window.location.href = '/sistema';
                        }, 1000);
                    } else {
                        alertify.error(resultado.error || 'Usuario o contraseña incorrectos');
                        document.getElementById('txtClave').value = '';
                        document.getElementById('txtClave').focus();
                    }
                    
                } catch (error) {
                    alertify.error('Error de conexión con el servidor');
                    console.error('Error:', error);
                } finally {
                    // Ocultar loading
                    btnText.classList.remove('d-none');
                    btnLoading.classList.add('d-none');
                }
            });
            
            // Enfocar el campo de usuario al cargar
            document.getElementById('txtUsuario').focus();
        });
    </script>
</body>
</html>
